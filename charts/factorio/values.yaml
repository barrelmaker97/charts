---
server:
  name: "Factorio Server"
  description: "Server Description"
  maxPlayers: 5
  public: false
  password: ""

config:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources: {}
    # requests:
    #   cpu: 20m
    #   memory: 20Mi
    # limits:
    #   cpu: 60m
    #   memory: 60Mi

image:
  repository: docker.io/factoriotools/factorio
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

persistence:
  storageClassName: ""
  size: 1Gi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Mount the service account's API token into the pods. Nothing in this
  # chart calls the Kubernetes API.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# Secure by default: the pod runs as the image's factorio user (845), cannot
# gain privileges, has no Linux capabilities and uses the runtime's default
# seccomp profile, which meets the restricted Pod Security Standard. Helm merges
# your values into these, so set a key to change it, or set it to null to drop
# it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 845
  runAsGroup: 845
  fsGroup: 845
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 34197
  externalTrafficPolicy: Local

resources: {}
  # requests:
  #   cpu: 800m
  #   memory: 1000Mi
  # limits:
  #   cpu: 1600m
  #   memory: 2000Mi

nodeSelector: {}

tolerations: []

affinity: {}
