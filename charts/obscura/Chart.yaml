---
apiVersion: v2
name: obscura
description: A Helm chart for Obscura Server
type: application
version: 0.12.3
appVersion: 0.9.5
maintainers:
  - name: barrelmaker97
    email: nolancooper97@gmail.com
    url: barrelmaker.dev
dependencies:
  - name: postgresql
    version: ~18.2.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled
  - name: valkey
    version: ~0.9.0
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
