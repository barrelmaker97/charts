{{- if .Values.minio.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "obscura.fullname" . }}-bucket-setup
  labels:
    {{- include "obscura.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    spec:
      containers:
        - name: mc
          image: cgr.dev/chainguard/minio-client:latest-dev
          command:
            - /bin/sh
            - -c
            - |
              set -e
              attempt=0
              while [ "$attempt" -lt 60 ]; do
                attempt=$((attempt + 1))
                if mc alias set myminio {{ include "obscura.storageEndpoint" . }} {{ include "obscura.storageAccessKey" . }} {{ include "obscura.storageSecretKey" . }}; then
                  break
                fi
                if [ "$attempt" -eq 60 ]; then
                  echo "MinIO was unavailable after 60 attempts" >&2
                  exit 1
                fi
                sleep 2
              done
              if ! mc ls myminio/{{ .Values.obscura.storage.bucket }} > /dev/null 2>&1; then
                mc mb myminio/{{ .Values.obscura.storage.bucket }};
              else
                echo "Bucket {{ .Values.obscura.storage.bucket }} already exists";
              fi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      restartPolicy: OnFailure
{{- end -}}
