{{- include "obscura.validateDatabaseConfiguration" . }}
{{- include "obscura.validateStorageConfiguration" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "obscura.fullname" . }}
  labels:
    {{- include "obscura.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "obscura.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "obscura.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "obscura.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.rustfs.enabled }}
      initContainers:
        - name: create-bucket
          image: {{ .Values.bucketSetup.image | quote }}
          securityContext:
            {{- toYaml .Values.bucketSetup.securityContext | nindent 12 }}
          env:
            - name: MC_CONFIG_DIR
              value: /mc-config
            - name: S3_ENDPOINT
              value: {{ include "obscura.storageEndpoint" . | quote }}
            - name: S3_BUCKET
              value: {{ .Values.obscura.storage.bucket | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obscura.storageCredentialsSecretName" . | quote }}
                  key: {{ include "obscura.storageAccessKeyName" . | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obscura.storageCredentialsSecretName" . | quote }}
                  key: {{ include "obscura.storageSecretKeyName" . | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              attempt=0
              until mc alias set local "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge {{ .Values.bucketSetup.attempts }} ]; then
                  echo "S3 endpoint unavailable after $attempt attempts" >&2
                  exit 1
                fi
                sleep 2
              done
              mc mb --ignore-existing "local/$S3_BUCKET"
          volumeMounts:
            - name: mc-config
              mountPath: /mc-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "obscura.fullname" . }}-config
          env:
            - name: OBSCURA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "obscura.databaseSecretName" . | quote }}
                  key: {{ include "obscura.databaseSecretKey" . | quote }}
            - name: OBSCURA_PUBSUB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "obscura.fullname" . }}-secret
                  key: pubsub-url
            - name: OBSCURA_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "obscura.fullname" . }}-secret
                  key: jwt-secret
            - name: OBSCURA_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obscura.storageCredentialsSecretName" . | quote }}
                  key: {{ include "obscura.storageAccessKeyName" . | quote }}
            - name: OBSCURA_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obscura.storageCredentialsSecretName" . | quote }}
                  key: {{ include "obscura.storageSecretKeyName" . | quote }}
          {{- if include "obscura.fcmEnabled" . }}
          volumeMounts:
            - name: fcm-credentials
              mountPath: /etc/obscura/fcm
              readOnly: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.obscura.server.port }}
              protocol: TCP
            - name: mgmt
              containerPort: {{ .Values.obscura.server.mgmtPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: mgmt
          readinessProbe:
            httpGet:
              path: /readyz
              port: mgmt
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.rustfs.enabled (include "obscura.fcmEnabled" .) }}
      volumes:
        {{- if .Values.rustfs.enabled }}
        - name: mc-config
          emptyDir: {}
        {{- end }}
        {{- if include "obscura.fcmEnabled" . }}
        - name: fcm-credentials
          secret:
            secretName: {{ include "obscura.fullname" . }}-secret
            items:
              - key: fcm-credentials-json
                path: credentials.json
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
