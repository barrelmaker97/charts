apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obscura.fullname" . }}-secret
  labels:
    {{- include "obscura.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.obscura.database.existingSecret.name }}
  database-url: {{ include "obscura.databaseUrl" . | b64enc | quote }}
  {{- end }}
  pubsub-url: {{ include "obscura.pubsubUrl" . | b64enc | quote }}
  {{- if not .Values.obscura.auth.existingSecret.name }}
  jwt-secret: {{ .Values.obscura.auth.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if and (not (and .Values.rustfs.enabled .Values.rustfs.secret.existingSecret)) (not .Values.obscura.storage.existingSecret.name) }}
  storage-access-key: {{ include "obscura.storageAccessKey" . | b64enc | quote }}
  storage-secret-key: {{ include "obscura.storageSecretKey" . | b64enc | quote }}
  {{- end }}
  {{- if and (include "obscura.fcmEnabled" .) (not .Values.obscura.fcm.existingSecret.name) }}
  fcm-credentials-json: {{ .Values.obscura.fcm.credentialsJson | b64enc | quote }}
  {{- end }}