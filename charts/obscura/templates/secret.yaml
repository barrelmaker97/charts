{{- $data := dict -}}
{{- if not .Values.obscura.database.existingSecret.name -}}
{{- $_ := set $data "database-url" (include "obscura.databaseUrl" .) -}}
{{- end -}}
{{- if not .Values.obscura.pubsub.existingSecret.name -}}
{{- $_ := set $data "pubsub-url" (include "obscura.pubsubUrl" .) -}}
{{- end -}}
{{- if not .Values.obscura.auth.existingSecret.name -}}
{{- $_ := set $data "jwt-secret" .Values.obscura.auth.jwtSecret -}}
{{- end -}}
{{- if and (not (and .Values.rustfs.enabled .Values.rustfs.secret.existingSecret)) (not .Values.obscura.storage.existingSecret.name) -}}
{{- $_ := set $data "storage-access-key" (include "obscura.storageAccessKey" .) -}}
{{- $_ := set $data "storage-secret-key" (include "obscura.storageSecretKey" .) -}}
{{- end -}}
{{- if and (include "obscura.fcmEnabled" .) (not .Values.obscura.fcm.existingSecret.name) -}}
{{- $_ := set $data "fcm-credentials-json" .Values.obscura.fcm.credentialsJson -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obscura.fullname" . }}-secret
  labels:
    {{- include "obscura.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
