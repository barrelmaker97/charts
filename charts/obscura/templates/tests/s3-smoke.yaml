{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "obscura.fullname" . }}-s3-smoke
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: s3-smoke
      image: {{ .Values.bucketSetup.image | quote }}
      env:
        - name: S3_ENDPOINT
          value: {{ include "obscura.storageEndpoint" . | quote }}
        - name: S3_BUCKET
          value: {{ .Values.obscura.storage.bucket | quote }}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "obscura.storageCredentialsSecretName" . | quote }}
              key: {{ include "obscura.storageAccessKeyName" . | quote }}
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "obscura.storageCredentialsSecretName" . | quote }}
              key: {{ include "obscura.storageSecretKeyName" . | quote }}
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          mc alias set local "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          key="local/$S3_BUCKET/helm-smoke-$HOSTNAME"
          printf 'obscura-chart-smoke\n' | mc pipe "$key"
          mc stat "$key"
          mc cat "$key" | grep -Fxq 'obscura-chart-smoke'
          mc rm "$key"
{{- end }}
