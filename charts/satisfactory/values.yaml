---
satisfactoryOpts:
  autopause: true
  autosaveInterval: 300
  autosaveNum: 3
  autosaveOnDisconnect: true
  crashReport: true
  debug: false
  disableSeasonalEvents: false
  maxPlayers: 4
  # Used only when the pod runs as root, which the image needs to chown its
  # files to this user. By default it runs as this user already
  # (podSecurityContext below), and these are ignored.
  pgid: 1000
  puid: 1000
  serverGamePort: 7777
  serverMessagingPort: 8888
  serverIP: "0.0.0.0"
  skipUpdate: false
  steamBeta: false

certificate:
  enabled: false
  issuerName: letsencrypt
  issuerKind: Issuer
  domain: satisfactory.game

image:
  repository: wolveix/satisfactory-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

env: []
envFrom: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

persistence:
  storageClassName: ""
  size: 20Gi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Mount the service account's API token into the pods. Nothing in this
  # chart calls the Kubernetes API.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# Secure by default: the pod runs as the image's steam user (1000), cannot gain
# privileges, has no Linux capabilities and uses the runtime's default seccomp
# profile, which meets the restricted Pod Security Standard. Helm merges your
# values into these, so set a key to change it, or set it to null to drop it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  externalTrafficPolicy: Local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
