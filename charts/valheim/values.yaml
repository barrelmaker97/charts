---
image:
  repository: docker.io/mbround18/valheim
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

timezone: "America/Chicago"
serverName: "Valheim"
worldName: "world"
public: false
metrics: false

persistence:
  storageClassName: ""
  size: 10Gi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Mount the service account's API token into the pods. Nothing in this
  # chart calls the Kubernetes API.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# Secure by default: the pod runs as the image's steam user (1000), cannot gain
# privileges, has no Linux capabilities and uses the runtime's default seccomp
# profile, which meets the restricted Pod Security Standard. Helm merges your
# values into these, so set a key to change it, or set it to null to drop it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 2456
  externalTrafficPolicy: Local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
