---
image:
  repository: docker.io/mbround18/valheim
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

timezone: "America/Chicago"
serverName: "Valheim"
worldName: "world"
public: false

# Requires public: true; the server only answers local status queries on port
# 2457 when it is public.
metrics:
  enabled: false
  # Port exposed by the exporter.
  port: 9100
  dashboard:
    enabled: false
    namespace: monitoring
    labels:
      grafana_dashboard: "1"
  serviceMonitor:
    enabled: false
    # Labels to be added to the ServiceMonitor.
    additionalLabels: {}
    # Annotations to be added to the ServiceMonitor.
    annotations: {}
    # Interval at which Prometheus scrapes the metrics from the target.
    scrapeInterval: 15s
    # Preserves the metric’s labels when they collide with the target’s labels.
    # honorLabels: true
    relabelings: []
    metricRelabelings: []
    # The label to use to retrieve the job name from.
    # jobLabel: "app.kubernetes.io/name"
    targetLabels: []
    # Per-scrape limit on number of labels accepted for a sample.
    labelLimit: 0
    # Per-scrape limit on length of label names accepted for a sample.
    labelNameLengthLimit: 0
    # Per-scrape limit on length of label values accepted for a sample.
    labelValueLengthLimit: 0
    # Per-scrape limit on the number of scraped samples accepted.
    sampleLimit: 0
    # Limit on the number of scraped targets accepted.
    targetLimit: 0

# Name of an existing Secret in the release namespace containing a password key.
# When set, no Secret is created and password is ignored.
existingSecret: ""
# Leave empty to generate a password when existingSecret is not set.
password: ""

persistence:
  storageClassName: ""
  size: 10Gi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Nothing in this chart calls the Kubernetes API.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname
  # template.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # For example, metallb.io/loadBalancerIPs to pin a LoadBalancer address.
  annotations: {}
  port: 2456
  externalTrafficPolicy: Local

resources: {}
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
