---
gitSync:
  repo: https://github.com/barrelmaker97/website.git
  ref: main
  contentDirectory: website  # Directory in the repo containing the site content.
  periodSeconds: 60
  image:
    repository: registry.k8s.io/git-sync/git-sync
    pullPolicy: IfNotPresent
    tag: v4.7.1
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources: {}
    # requests:
    #   cpu: 20m
    #   memory: 500Mi
    # limits:
    #   cpu: 100m
    #   memory: 1Gi

replicaCount: 1

image:
  repository: docker.io/nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Mount the service account's API token into the pods. Nothing in this
  # chart calls the Kubernetes API.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# Secure by default: the pod runs as UID 1000, cannot gain privileges, has no
# Linux capabilities and uses the runtime's default seccomp profile, which meets
# the restricted Pod Security Standard. Helm merges your values into these, so
# set a key to change it, or set it to null to drop it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: false
  annotations: {}
  # Gateways this route should attach to
  parentRefs: []
  #  - name: gateway
  #    namespace: envoy-gateway-system
  #    sectionName: https
  hostnames: []
  #  - website.local
  matches:
    - path:
        type: PathPrefix
        value: /
  # Filters applied to requests matching the rule above
  filters: []
  # Additional custom rules appended to the route
  additionalRules: []

resources: {}
  # requests:
  #   cpu: 20m
  #   memory: 500Mi
  # limits:
  #   cpu: 100m
  #   memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  # Exactly one of minAvailable or maxUnavailable must be set when enabled.
  minAvailable: null
  maxUnavailable: 1

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []
